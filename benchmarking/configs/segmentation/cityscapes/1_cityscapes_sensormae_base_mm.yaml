experiment_name: 1_seg_cityscapes_sensormae_base_mm
task: segmentation
backbone: ./weights/sensormae-base-mm.pth
num_classes: 19
modalities: [rgb]
modality_channels: {rgb: 3}
data_root: ./data/cityscapes
layer_decay: 0.75
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.75, 2.0]
lr: 0.001
backbone_lr: 0.0002
gradient_clip_val: 5.0
batch_size: 16
accumulate_grad_batches: 4
weight_decay: 0.05
drop_path_rate: 0.1
decay_type: cosine
min_lr: 1.0e-06
num_warmup_epochs: 10
image_size: [768, 768]
epochs: 150
