experiment_name: 1_seg_mfnet_rgb_mae
task: segmentation
backbone: facebook/vit-mae-base
num_classes: 9
modalities: [rgb]
modality_channels: {rgb: 3}
data_root: ./data/mfnet
layer_decay: 0.75
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.8, 1.5]
lr: 0.0002
backbone_lr: 0.0001
gradient_clip_val: 1.0
batch_size: 16
accumulate_grad_batches: 4
weight_decay: 0.05
drop_path_rate: 0.1
decay_type: cosine
min_lr: 1.0e-06
num_warmup_epochs: 25
image_size: [480, 480]
epochs: 250
