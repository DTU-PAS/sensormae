experiment_name: 1_seg_dsec_seg_rgb_dino
task: segmentation
backbone: facebook/dino-vitb16
num_classes: 11
modalities: [rgb]
modality_channels: {rgb: 3}
data_root: ./data/dsec
layer_decay: 0.75
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.8, 1.5]
lr: 0.0005
backbone_lr: 5.0e-06
gradient_clip_val: 1.0
batch_size: 16
accumulate_grad_batches: 4
weight_decay: 0.05
drop_path_rate: 0.1
decay_type: cosine
min_lr: 1.0e-06
num_warmup_epochs: 20
image_size: [640, 640]
epochs: 200
