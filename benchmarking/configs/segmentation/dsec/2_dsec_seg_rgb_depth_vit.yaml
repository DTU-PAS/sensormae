experiment_name: 2_seg_dsec_seg_rgb_depth_vit
task: segmentation
backbone: google/vit-base-patch16-224
num_classes: 11
modalities: [rgb, depth]
modality_channels: {rgb: 3, depth: 1}
data_root: ./data/dsec
layer_decay: 0.75
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.8, 1.5]
lr: 0.0002
backbone_lr: 0.0001
gradient_clip_val: 1.0
batch_size: 4
accumulate_grad_batches: 16
weight_decay: 0.05
drop_path_rate: 0.1
decay_type: cosine
min_lr: 1.0e-06
num_warmup_epochs: 20
image_size: [640, 640]
epochs: 200
