experiment_name: 2_det_stf_snir+lidar_vit
task: detection
backbone: google/vit-base-patch16-224
num_classes: 3
modalities: [snir, lidar]
modality_channels: {snir: 1, lidar: 1}
data_root: ./data/stf
layer_decay: 1.0
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.5, 2.0]
lr: 0.0001
backbone_lr: 1.0e-05
num_warmup_epochs: 5
decay_type: none
gradient_clip_val: 0.1
batch_size: 8
accumulate_grad_batches: 8
weight_decay: 0.1
drop_path_rate: 0.1
head_type: cascade_rcnn
image_size: [360, 1248]
epochs: 80
test_splits: [test_clear_day.txt, test_clear_night.txt]
