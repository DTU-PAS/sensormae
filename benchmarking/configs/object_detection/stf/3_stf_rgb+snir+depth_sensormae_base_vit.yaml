experiment_name: 3_det_stf_rgb+snir+depth_sensormae_base_vit
task: detection
backbone: ./weights/sensormae-base-vit.pth
num_classes: 3
modalities: [rgb, snir, depth]
modality_channels: {rgb: 3, snir: 1, depth: 1}
data_root: ./data/stf
layer_decay: 1.0
adam_betas: [0.9, 0.999]
color_jitter: 0.4
lsj_scale: [0.5, 2.0]
lr: 0.0001
backbone_lr: 1.0e-05
num_warmup_epochs: 5
decay_type: none
gradient_clip_val: 0.1
batch_size: 4
accumulate_grad_batches: 16
weight_decay: 0.1
drop_path_rate: 0.1
head_type: cascade_rcnn
image_size: [360, 1248]
epochs: 80
test_splits: [test_clear_day.txt, test_clear_night.txt]
